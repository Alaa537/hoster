name: hosting
description: HOST PANEL — cloud hosting management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.1
  google_fonts: ^6.2.1
  flutter_slidable: ^3.0.1
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  package_info_plus: ^8.1.1
  crypto: ^3.0.5
  confetti: ^0.7.0
  audioplayers: ^6.1.0
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#07070F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
