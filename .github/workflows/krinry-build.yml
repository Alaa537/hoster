name: krinry Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        default: release
        options: [debug, profile, release]
      output_type:
        type: choice
        default: apk
        options: [apk, appbundle, apk-split]
      target_platform:
        type: choice
        default: all
        options: [all, android-arm64, android-arm, android-x64]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable
      - run: flutter pub get
      - run: flutter create --platforms android --org com.alaa --project-name hoster .
      - name: cleartext
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'android:label="[^"]*"','android:label="HOST PANEL"',s,count=1)
          if 'usesCleartextTraffic' not in s:
            s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          p.write_text(s)
          PY
      - run: dart run flutter_launcher_icons
        continue-on-error: true
      - name: Build
        run: |
          T="${{ github.event.inputs.build_type }}"
          O="${{ github.event.inputs.output_type }}"
          P="${{ github.event.inputs.target_platform }}"
          if [ "$O" = "apk" ]; then
            [ "$P" != "all" ] && flutter build apk --$T --target-platform $P || flutter build apk --$T
          elif [ "$O" = "apk-split" ]; then flutter build apk --$T --split-per-abi
          else flutter build appbundle --$T; fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
