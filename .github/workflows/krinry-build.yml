name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, profile, release]
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options: [apk, appbundle, apk-split]
      target_platform:
        description: 'Target platform'
        required: false
        default: 'all'
        type: choice
        options: [all, android-arm64, android-arm, android-x64]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # مهم: من غير cache عشان مفيش android/ لسه

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android --org com.alaa --project-name hoster .

      - name: App label + cleartext HTTP
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="HOST PANEL"', s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'networkSecurityConfig' not in s:
              s = s.replace('<application', '<application android:networkSecurityConfig="@xml/network_security_config"', 1)
          p.write_text(s)
          res = Path('android/app/src/main/res/xml')
          res.mkdir(parents=True, exist_ok=True)
          (res / 'network_security_config.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
  <base-config cleartextTrafficPermitted="true"/>
  <domain-config cleartextTrafficPermitted="true">
    <domain includeSubdomains="true">alaa-dev.kdns.fr</domain>
  </domain-config>
</network-security-config>
''')
          print('OK')
          PY

      - name: Icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          PLAT="${{ github.event.inputs.target_platform }}"
          if [ "$OUT" = "apk" ]; then
            if [ "$PLAT" != "all" ]; then
              flutter build apk --$TYPE --target-platform $PLAT
            else
              flutter build apk --$TYPE
            fi
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          else
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
